<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — O Carballo Tapería</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/o-carballo-taperia-web/assets/img/logo/icon-96.png" type="image/png">
<link rel="apple-touch-icon" href="/o-carballo-taperia-web/assets/img/logo/icon-180.png">
<meta name="theme-color" content="#1F3F5C">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/o-carballo-taperia-web/css/style.css?v=3">
<style>
  /* Deliberadamente pequeño y autocontenido — GitHub Pages sirve este
     archivo para cualquier ruta que no exista, así que todos los enlaces
     y assets usan la ruta absoluta /o-carballo-taperia-web/... en vez de
     relativa (una ruta relativa se resolvería contra la URL rota que
     escribió el visitante, no contra la raíz del sitio). Si el sitio pasa
     a un dominio propio, hay que actualizar estas rutas igual que el
     resto de URLs absolutas. */
  body { display: flex; min-height: 100vh; }
  .notfound { margin: auto; max-width: 32rem; padding: 3rem 1.5rem; text-align: center; }
  .notfound-mark { width: 56px; height: 56px; margin: 0 auto 1.75rem; }
  .notfound-code { font-family: var(--display); font-size: 0.95rem; font-weight: 700; color: var(--tinta-tenue); letter-spacing: 0.08em; }
  .notfound h1 {
    margin-top: 0.75rem;
    font-family: var(--display);
    font-size: clamp(1.9rem, 5vw, 2.8rem);
    font-weight: 600;
    line-height: 1.15;
  }
  .notfound p { margin-top: 1.1rem; color: var(--tinta-suave); font-size: 1.05rem; line-height: 1.6; }
  .notfound-actions { margin-top: 2.25rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <main class="notfound">
    <img class="notfound-mark" src="/o-carballo-taperia-web/assets/img/logo/icon-96.png" alt="" width="56" height="56">
    <p class="notfound-code">Error 404</p>
    <h1>Este tramo del camino no lleva a ninguna parte.</h1>
    <p>
      La página que buscas no existe o se ha movido. Vuelve al inicio, o pásate directamente por la
      carta — seguro que ahí encuentras algo mejor.
    </p>
    <div class="notfound-actions">
      <a class="btn btn-primary" href="/o-carballo-taperia-web/"><span>Volver al inicio</span></a>
      <a class="btn btn-ghost" href="/o-carballo-taperia-web/#carta"><span>Ver la carta</span></a>
    </div>
  </main>
</body>
</html>
